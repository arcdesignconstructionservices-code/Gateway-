<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC+ Gateway</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffa203">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARC+ Gateway">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gateway.css">
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside id="side">
    <div class="brand"><img src="logo.png" alt="ARC+"><div><b>ARC+ Gateway</b><small>Internal portal</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">ARC+</div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="iconbtn" id="burger" aria-label="Toggle menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb"><b>ARC+ Gateway</b><small id="crumbSub">Internal portal</small></div>
      <span class="spacer"></span>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search tools…" autocomplete="off"></label>

      <button class="iconbtn bell" id="bellBtn" title="Access requests" aria-label="Access requests" hidden><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="bellBadge" hidden>0</span></button>      <button class="iconbtn" id="themeBtn" title="Switch light / dark" aria-label="Switch light / dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <div class="user" hidden><span class="avatar" id="uAvatar"></span><div class="umeta"><b id="uName"></b><small id="uRole"></small></div>
        <button class="iconbtn" id="pwBtn" title="Change password" aria-label="Change password"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        <button class="iconbtn" id="outBtn" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
